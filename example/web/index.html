<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!--
    The development template: what `flutter run` serves, with Flutter's own
    bootstrap (web/flutter_bootstrap.js, which shows the loading screen). A
    release is built by tool/build_web.sh, which ships index.prod.html
    instead (the `sw` bootstrap with the same loading screen).
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat Scroll View | Development</title>
  <meta name="description" content="The chat_scroll_view example: an anchor-based chat viewport with selection, rich text and an emoji panel.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-title" content="Chat Scroll View">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <!-- The app's own background from the first byte: no white flash. -->
  <style>html,body{margin:0;background:#111418}</style>
</head>
<body>
  <!--
    The WebAuthn bridge supabase_flutter → passkeys_web calls: served with the
    app and not waited for (see vendor/passkeys/README.md).
  -->
  <script src="vendor/passkeys/bundle.js" async></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
