name: emoji_data
description: Reactive emoji catalog, recents, search, and skin-tone prefs for host apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  shared_preferences: ^2.5.3
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.chat_scroll.emoji_data
        pluginClass: EmojiDataPlugin
      ios:
        pluginClass: EmojiDataPlugin
      macos:
        pluginClass: EmojiDataPlugin
      windows:
        pluginClass: EmojiDataPluginCApi
      linux:
        pluginClass: EmojiDataPlugin
      web:
        pluginClass: EmojiDataWeb
        fileName: emoji_data_web.dart
