name: chat_scroll_view_example
description: Example app for the chat_scroll_view package.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  attach_model:
    path: ../packages/attach_model
  attach_sheet:
    path: ../packages/attach_sheet
  bulletins:
    path: ../packages/bulletins
  chat_scroll_view:
    path: ../
  keyboard_insets:
    path: packages/keyboard_insets
  l: ^5.0.1
  chat_composer:
    path: ../packages/chat_composer
  chat_wallpaper:
    path: ../packages/chat_wallpaper
  chrome_foundation:
    path: ../packages/chrome_foundation
  content_assets:
    path: ../packages/content_assets
  content_model:
    path: ../packages/content_model
  # Not imported: depending on it is what bundles the catalog assets that
  # integration_test/panel_perf/shipped_glyphs.dart reads.
  emoji_catalog_pack:
    path: ../packages/emoji_catalog_pack
  emoji_data:
    path: ../packages/emoji_data
  glyph_atlas:
    path: ../packages/glyph_atlas
  kv_shared_preferences:
    path: ../packages/kv_shared_preferences
  # mpx, from git at one pinned commit (see the root pubspec): the media core,
  # the bytes cache and its fetch adapter, and the two decoders whose build
  # hooks build their native libraries for the app.
  http_bytes_cache:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/http_bytes_cache
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx_capture:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_capture
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx_library:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_library
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx_lottie:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_lottie
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx_player:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_player
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx_ui:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_ui
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  mpx_video_decoder:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_video_decoder
      ref: ab2def95fc6865f057655c48a213f03bf5fbe81c
  panel_catalog:
    path: ../packages/panel_catalog
  panel_pages:
    path: ../packages/panel_pages
  panel_presentation:
    path: ../packages/panel_presentation
  panel_shell:
    path: ../packages/panel_shell
  rich_clipboard:
    path: ../packages/rich_clipboard
  viewport_scroll:
    path: ../packages/viewport_scroll
  flutter_md:
    git:
      url: https://github.com/itsezlife/md.git
      ref: v0.9.3
  # The Giphy client's transport, injectable so tests pass a fake.
  http: ^1.6.0
  listen: ^1.0.1
  meta: ^1.17.0
  supabase_flutter: ^2.15.0
  control: 1.0.0-dev.1
  # Loads the wallpaper pattern, compiled from SVG at build time.
  vector_graphics: ^1.1.19
  freezed_annotation: ^3.1.0

dev_dependencies:
  # Golden baselines are the CI runner's: compared and regenerated there only.
  golden_baseline:
    path: ../packages/golden_baseline
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Perf harness (integration_test/, test_driver/): timeline summary writer and
  # the viewport's public controller and diagnostics.
  flutter_driver:
    sdk: flutter
  # The traced pass collects the VM timeline in chunks.
  vm_service: ^15.0.0
  # The pager whose off-screen pages a flicker test switches.
  swipe_pager:
    path: ../packages/swipe_pager
  freezed: ^3.2.5
  # Compiles the wallpaper pattern SVG to vector graphics (asset transformer).
  vector_graphics_compiler: ^1.1.19
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/chat/pagedown.webp
    # The wallpaper pattern and its licence credit; see LICENSE.md there.
    - path: assets/chat_wallpaper/career.svg
      transformers:
        - package: vector_graphics_compiler
    - assets/chat_wallpaper/LICENSE.md
    # The animated emoji pack and its licence credit; see LICENSE.md there.
    - assets/animated_emoji/
    # Lottie stickers authored for the demo (no third-party artwork).
    - assets/lottie_stickers/
    # Static stickers authored for the demo (no third-party artwork).
    - assets/static_stickers/
    # Video stickers, clips and GIFs generated for the demo from synthetic
    # sources (no third-party artwork); the README there has the commands.
    - assets/video_stickers/
    # Frame counter clips, each frame numbered in pixels; made by
    # tool/frame_counter.dart, whose header has the frame's layout.
    - assets/frame_counter/
    # A local corpus of third-party Lottie stickers: the folder holds only a
    # README and a .gitignore in a checkout (the files are third-party and never
    # committed), so it exists and builds without them. See the README there.
    - assets/sticker_corpus/
    - path: assets/comments/
      platforms:
        - android
        - ios
        - macos
        - linux
        - windows
