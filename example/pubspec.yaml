name: chat_scroll_view_example
description: Example app for the chat_scroll_view package.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  chat_scroll_view:
    path: ../
  keyboard_insets:
    path: packages/keyboard_insets
  l: ^5.0.1
  catalog_assets:
    path: ../packages/catalog_assets
  chat_composer:
    path: ../packages/chat_composer
  chat_wallpaper:
    path: ../packages/chat_wallpaper
  chrome_foundation:
    path: ../packages/chrome_foundation
  content_model:
    path: ../packages/content_model
  # Not imported: depending on it is what bundles the catalog assets that
  # integration_test/panel_perf/shipped_glyphs.dart reads.
  emoji_catalog_pack:
    path: ../packages/emoji_catalog_pack
  emoji_data:
    path: ../packages/emoji_data
  image_decoder:
    path: ../packages/image_decoder
  kv_shared_preferences:
    path: ../packages/kv_shared_preferences
  # Depending on lottie_native is what runs its native build hook for the app;
  # lottie_decoder is the Decoder over it.
  lottie_decoder:
    path: ../packages/lottie_decoder
  lottie_native:
    path: ../packages/lottie_native
  panel_pages:
    path: ../packages/panel_pages
  panel_presentation:
    path: ../packages/panel_presentation
  panel_shell:
    path: ../packages/panel_shell
  rich_clipboard:
    path: ../packages/rich_clipboard
  # Depending on video_native is what runs its native build hook for the app
  # (macOS arm64); video_decoder is the Decoder over it.
  video_decoder:
    path: ../packages/video_decoder
  video_native:
    path: ../packages/video_native
  flutter_md:
    git:
      url: https://github.com/itsezlife/md.git
      ref: v0.9.3
  # The Giphy client's transport, injectable so tests pass a fake.
  http: ^1.6.0
  listen: ^1.0.1
  meta: ^1.17.0
  supabase_flutter: ^2.15.0
  control: 1.0.0-dev.1
  # Loads the wallpaper pattern, compiled from SVG at build time.
  vector_graphics: ^1.1.19
  freezed_annotation: ^3.1.0

dev_dependencies:
  # Golden baselines are the CI runner's: compared and regenerated there only.
  golden_baseline:
    path: ../packages/golden_baseline
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Perf harness (integration_test/, test_driver/): timeline summary writer and
  # the viewport's public controller and diagnostics.
  flutter_driver:
    sdk: flutter
  # The traced pass collects the VM timeline in chunks.
  vm_service: ^15.0.0
  panel_catalog:
    path: ../packages/panel_catalog
  freezed: ^3.2.5
  # Compiles the wallpaper pattern SVG to vector graphics (asset transformer).
  vector_graphics_compiler: ^1.1.19
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/chat/pagedown.webp
    # The wallpaper pattern and its licence credit; see LICENSE.md there.
    - path: assets/chat_wallpaper/career.svg
      transformers:
        - package: vector_graphics_compiler
    - assets/chat_wallpaper/LICENSE.md
    # The animated emoji pack and its licence credit; see LICENSE.md there.
    - assets/animated_emoji/
    # Lottie stickers authored for the demo (no third-party artwork).
    - assets/lottie_stickers/
    # Static stickers authored for the demo (no third-party artwork).
    - assets/static_stickers/
    # Video stickers, clips and GIFs generated for the demo from synthetic
    # sources (no third-party artwork); the README there has the commands.
    - assets/video_stickers/
    # A local corpus of Telegram's Lottie stickers: the folder holds only a
    # README and a .gitignore in a checkout (the files are Telegram's and never
    # committed), so it exists and builds without them. See the README there.
    - assets/telegram_stickers/
    - path: assets/comments/
      platforms:
        - android
        - ios
        - macos
        - linux
        - windows
