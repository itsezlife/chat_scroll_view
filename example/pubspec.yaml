name: chat_scroll_view_example
description: Example app for the chat_scroll_view package.
publish_to: none
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  chat_scroll_view:
    path: ../
  keyboard_insets:
    path: packages/keyboard_insets
  chat_chrome:
    path: ../packages/chat_chrome
  emoji_data:
    path: ../packages/emoji_data
  flutter_md:
    git:
      url: https://github.com/itsezlife/md.git
      ref: feat/selection-chrome
  meta: ^1.17.0
  supabase_flutter: ^2.15.0
  control: 1.0.0-dev.1
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Perf harness (integration_test/, test_driver/): timeline summary writer and
  # temporary experiment probes. See .scratch/panel-catalog-glyph-perf.
  flutter_driver:
    sdk: flutter
  panel_catalog:
    path: ../packages/panel_catalog
  freezed: ^3.2.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/chat/pagedown.webp
    - path: assets/comments/
      platforms:
        - android
        - ios
        - macos
        - linux
        - windows
