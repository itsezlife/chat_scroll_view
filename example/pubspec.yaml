name: chat_scroll_view_example
description: Example app for the chat_scroll_view package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  chat_scroll_view:
    path: ../
  keyboard_insets:
    path: packages/keyboard_insets
  meta: ^1.17.0
  supabase_flutter: ^2.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - path: assets/comments/
      platforms:
        - android
        - ios
        - macos
        - linux
        - windows
