name: content_assets
description: Chat content on mpx_core's asset cache, keyed by ContentKey; glyphs from the glyph atlas, inline embeds and chat presets.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.27.0'

dependencies:
  content_model:
    path: ../content_model
  flutter:
    sdk: flutter
  glyph_atlas:
    path: ../glyph_atlas
  listen: ^1.0.1
  meta: ^1.17.0
  # mpx is consumed from git, pinned to one commit (see the root pubspec).
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: 9fbb8fc331b7c151f4a63c1ce3b9aa64ddf45f7a
  # Only lib/testing.dart needs this: its contract suites are written with the
  # test framework, and a library cannot import a dev dependency.
  flutter_test:
    sdk: flutter

dev_dependencies:
  test: ^1.25.0
