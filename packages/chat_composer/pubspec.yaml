name: chat_composer
description: >
  Slot-based chat composer: a host-built ComposerSpec, a glass island view,
  an input-only controller, an entity-aware text controller that produces a
  RichText, and host-registered input queries.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.27.0'

dependencies:
  characters: ^1.4.0
  chrome_foundation:
    path: ../chrome_foundation
  composer_editable:
    path: ../composer_editable
  content_assets:
    path: ../content_assets
  content_model:
    path: ../content_model
  flutter:
    sdk: flutter
  listen: ^1.0.1
  meta: ^1.17.0

dev_dependencies:
  # Tests build the media cache the content scope sits on.
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: 276e4baba82ec409ebda34dafeb3951f7307fe58
  # Golden baselines are the CI runner's: compared and regenerated there only.
  golden_baseline:
    path: ../golden_baseline
  flutter_test:
    sdk: flutter

flutter:
  # The stock icon registry draws Material glyphs; tests and goldens need the
  # font bundled.
  uses-material-design: true
