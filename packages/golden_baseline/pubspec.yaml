name: golden_baseline
description: >
  Test support: golden baselines belong to one host (the CI runner), are
  compared only there and are regenerated only there.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
