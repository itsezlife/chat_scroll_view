name: attach_sheet
description: >
  The attach sheet: the mobile container a user picks media and files to send
  from, its platform policy, and the page contract hosts extend.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.32.0'

dependencies:
  attach_model:
    path: ../attach_model
  chat_composer:
    path: ../chat_composer
  chrome_foundation:
    path: ../chrome_foundation
  content_model:
    path: ../content_model
  flutter:
    sdk: flutter
  meta: ^1.17.0
  # mpx (github.com/itsezlife/mpx), pinned to one commit as in every pubspec:
  # preparation and the camera, the media cache's keys and views, the device
  # library and file intake, the library grid (ADR 046).
  mpx_capture:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_capture
      ref: 8e6e4c668fb39c067cfa02781d1a1e1096580445
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: 8e6e4c668fb39c067cfa02781d1a1e1096580445
  mpx_library:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_library
      ref: 8e6e4c668fb39c067cfa02781d1a1e1096580445
  mpx_player:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_player
      ref: 8e6e4c668fb39c067cfa02781d1a1e1096580445
  mpx_ui:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_ui
      ref: 8e6e4c668fb39c067cfa02781d1a1e1096580445
  # The page's fling, run by the sheet between its rest and its top.
  viewport_scroll:
    path: ../viewport_scroll

dev_dependencies:
  # Golden baselines are the CI runner's: compared and regenerated there only.
  golden_baseline:
    path: ../golden_baseline
  flutter_test:
    sdk: flutter
