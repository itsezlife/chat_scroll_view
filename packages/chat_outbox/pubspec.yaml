name: chat_outbox
description: >
  Outgoing chat messages over mpx publish jobs, with their status, row ids,
  restart and the lookups a host matches echoes by.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.38.0'

dependencies:
  # PlannedSend and AttachItem, the send the outbox turns into a publish job
  # (ADR 048).
  attach_model:
    path: ../attach_model
  # CapabilityAction, the action a server denial names in a failed message's
  # reason (ADR 049; ADR 020 amendment, the chat_outbox row).
  chat_capabilities:
    path: ../chat_capabilities
  # ChatDataSource.rebaseTail, the one move of the provisional tail, and the
  # IChatMessage rows an id strategy places (ADR 048; ADR 020 amendment). The root
  # never depends on chat_outbox, so the graph stays a DAG.
  chat_scroll_view:
    path: ../..
  # MediaItemId and ContentKey, an outgoing item's identity and local key, and
  # the diagnostics contract (ChatDiagnostics, DiagnosticOp; ADR 050).
  content_model:
    path: ../content_model
  # A Flutter package from the start: the facade grows listenables and the
  # send origin's rect, and the edges to the root package and mpx_transfer
  # are Flutter packages (ADR 048).
  flutter:
    sdk: flutter
  # Only lib/testing.dart needs this: the id strategy contract suite is written
  # with the test framework, and a library cannot import a dev dependency.
  # Production entry points never import it.
  flutter_test:
    sdk: flutter
  # The listenables the outbox exposes (send in flight) and reads (the chat
  # capabilities), as chat_capabilities declares them.
  listen: ^1.0.1
  meta: ^1.17.0
  # mpx (github.com/itsezlife/mpx), pinned to one commit as in every pubspec:
  # the media keys and preparation inputs a publish item names (mpx_core),
  # and the publish jobs the outbox projects (mpx_transfer; ADR 048).
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: a577316dd39ca36fb2130e755dd768f77016fd65
  mpx_transfer:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_transfer
      ref: a577316dd39ca36fb2130e755dd768f77016fd65
