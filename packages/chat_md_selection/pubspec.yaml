name: chat_md_selection
description: >
  Markdown text selection bridge for chat: selection policy, span yield or direct entry, 
  single-document character ranges.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  chat_scroll_view:
    path: ../..
    
  # Markdown renderer.
  flutter_md:
    git:
      url: https://github.com/itsezlife/md.git
      ref: 1686337e1b55bc6288b59a9c13eed55c28b37ae5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
