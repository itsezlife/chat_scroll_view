name: viewport_scroll
description: >
  A viewport's user-driven scroll: per-platform scroll physics and their
  runtime, the keyboard scroll keys, and a fast scrollbar with a section label.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  # Only lib/testing.dart needs this: its contract tests are written with
  # the test framework, and a library cannot import a dev dependency.
  # Production entry points never import it.
  flutter_test:
    sdk: flutter
