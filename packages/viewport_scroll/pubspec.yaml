name: viewport_scroll
description: >
  A viewport's user-driven scroll: the scroll physics (a fling paired with an
  edge effect, per platform), their per-viewport runtime, and the keyboard
  scroll keys. Nothing chat or panel specific.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
