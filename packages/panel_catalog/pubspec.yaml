name: panel_catalog
description: Panel Catalog Viewport — extent-scroll catalog body with paint leaves.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  catalog_assets:
    path: ../catalog_assets
  content_model:
    path: ../content_model
  flutter:
    sdk: flutter
  meta: ^1.17.0
  # Only lib/testing.dart needs this: its contract suite
  # (runCatalogScrollPositionContract) is written with the test framework, and a
  # library cannot import a dev dependency. Production entry points never
  # import it.
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  # Frozen A/B baseline for panel catalog benches (issue 08) — not a runtime dep.
  super_sliver_list: ^0.4.1
