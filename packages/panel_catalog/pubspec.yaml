name: panel_catalog
description: Panel Catalog Viewport — extent-scroll catalog body with paint leaves.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  content_assets:
    path: ../content_assets
  content_model:
    path: ../content_model
  flutter:
    sdk: flutter
  listen: ^1.0.1
  meta: ^1.17.0
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: 08dca8a926a48b2dee9a68dbf40abe863a474aa4
  viewport_scroll:
    path: ../viewport_scroll
  # Only lib/testing.dart needs this: its contract suite
  # (runCatalogScrollPositionContract) is written with the test framework, and a
  # library cannot import a dev dependency. Production entry points never
  # import it.
  flutter_test:
    sdk: flutter

dev_dependencies:
  # Golden baselines are the CI runner's: compared and regenerated there only.
  golden_baseline:
    path: ../golden_baseline
  flutter_lints: ^6.0.0
  # Frozen A/B baseline for panel catalog benches (issue 08) — not a runtime dep.
  super_sliver_list: ^0.4.1
  # Tests drive a real glyph atlas under the viewport; lib/ never imports it.
  glyph_atlas:
    path: ../glyph_atlas
