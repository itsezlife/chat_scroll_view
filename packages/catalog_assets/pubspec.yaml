name: catalog_assets
description: Process-wide global catalog asset cache for catalog and conversation leaves, plus the glyph atlas baker.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  # The testing entry point (lib/testing.dart) ships contract suites, which are
  # written with the test framework; production entry points never import it.
  flutter_test:
    sdk: flutter

dev_dependencies:
  # The "current catalogue" budget test reads the real glyph set.
  emoji_data:
    path: ../emoji_data
  lints: ^6.0.0
  test: ^1.25.0
