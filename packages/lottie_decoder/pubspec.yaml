name: lottie_decoder
description: >
  The Lottie decoder adapter: an async engine seam over a lottie_native
  binding, native page memory a render isolate can write, and a frame renderer
  for the catalog_assets frame pool.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

dependencies:
  catalog_assets:
    path: ../catalog_assets
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  lottie_native:
    path: ../lottie_native
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
