name: lottie_decoder
description: >
  The Lottie decoder adapter: the Decoder, an async engine seam over a lottie_native
  binding, native page memory a render isolate can write, and a frame renderer
  for the catalog_assets frame pool.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

dependencies:
  catalog_assets:
    path: ../catalog_assets
  content_model:
    path: ../content_model
  # SHA-256 of a file's bytes names its frames in the frame cache.
  crypto: ^3.0.6
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  # Only lib/testing.dart needs this: the contract suite is written with the
  # test framework, and a library cannot import a dev dependency (the same
  # arrangement as lottie_native). Production entry points never import it.
  flutter_test:
    sdk: flutter
  lottie_native:
    path: ../lottie_native
  meta: ^1.17.0


dev_dependencies:
  # The web engine's handshake timeout is tested on a fake clock.
  fake_async: ^1.3.3
