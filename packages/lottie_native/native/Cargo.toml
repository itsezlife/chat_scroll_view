[package]
name = "chat_lottie"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI over tlottie: gunzip, input checks, probe and batch render for Lottie stickers."

[lib]
name = "chat_lottie"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No crates.io release exists; the pin is the revision Telegram Desktop ships.
tlottie = { git = "https://github.com/dkaraush/tlottie", rev = "92df98dc20" }
# Pure-Rust inflate backend (miniz_oxide): no C toolchain needed to cross-build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" # catch_unwind at the boundary needs unwinding
