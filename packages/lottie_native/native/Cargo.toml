[package]
name = "chat_lottie"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.88" # slice::as_chunks
description = "C ABI over tlottie: gunzip, input checks, probe and batch render for Lottie stickers."

[lib]
name = "chat_lottie"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No crates.io release exists; the pin is a git revision of tlottie.
tlottie = { git = "https://github.com/dkaraush/tlottie", rev = "92df98dc20" }
# Pure-Rust inflate backend (miniz_oxide): no C toolchain needed to cross-build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
# Pure Rust and unsafe-free in these features, and it builds for wasm, so the
# web wrapper shares the frame codec (ADR 042).
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-encode", "safe-decode"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" # catch_unwind at the boundary needs unwinding
