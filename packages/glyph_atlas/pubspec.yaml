name: glyph_atlas
description: The baked glyph atlas of colour emoji, drawn as AtlasSprites of mpx_core; planning, rasterising, paging and its on-disk cache.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  # mpx is consumed from git, pinned to one commit (see the root pubspec).
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: c66f02e7b745185d4071f68345b94b15421f4202
  # Only lib/testing.dart needs this: its contract suites are written with the
  # test framework, and a library cannot import a dev dependency.
  flutter_test:
    sdk: flutter

dev_dependencies:
  test: ^1.25.0
