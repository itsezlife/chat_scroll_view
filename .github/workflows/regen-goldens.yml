name: Regenerate emoji goldens (temporary)

# One-off: regenerates the emoji golden baselines on the CI runner and uploads
# them, so they can be committed. Removed once the baselines are committed.
on:
  push:
    branches: [feat/chat-polish]
    paths: [.github/workflows/regen-goldens.yml]

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: chat_scroll_view
      - uses: actions/checkout@v4
        with:
          repository: itsezlife/md
          ref: v0.4.4
          path: md
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Regenerate goldens
        working-directory: chat_scroll_view
        run: |
          flutter pub get
          cd example
          flutter test --update-goldens \
            test/golden/demo_emoji_message_golden_test.dart \
            test/golden/demo_emoji_message_menu_golden_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: chat_scroll_view/example/test/golden/goldens
