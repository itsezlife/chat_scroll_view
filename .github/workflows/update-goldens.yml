name: Update goldens

# Temporary: regenerates the example golden baselines on the CI runner (the
# reference platform) and uploads them as an artifact. Remove once committed.
on:
  push:
    branches: [fix/linux-golden-baselines]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: chat_scroll_view
      - uses: actions/checkout@v4
        with:
          repository: itsezlife/md
          ref: feat/selection-chrome
          path: md
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Resolve workspace
        working-directory: chat_scroll_view
        run: flutter pub get
      - name: Regenerate goldens
        working-directory: chat_scroll_view/example
        run: flutter test --update-goldens test/golden/demo_widgets_golden_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: chat_scroll_view/example/test/golden/goldens/
