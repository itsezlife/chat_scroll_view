name: Update goldens (one-off)

# Regenerates the golden baselines on the CI runner and commits the PNGs back
# to the branch: baselines made on another platform differ from the runner's
# rendering. It runs when this file is pushed on the branch below, and the
# commit that lands the new PNGs does not change this file, so it does not
# loop. Delete it once the baselines are in.
on:
  push:
    branches: [feat/chat-polish-3]
    paths: [.github/workflows/update-goldens.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: chat_scroll_view
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: itsezlife/md
          ref: v0.4.3
          path: md
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Resolve the workspace
        working-directory: chat_scroll_view
        run: flutter pub get

      # Every member whose goldens failed on this runner. A test that fails for
      # another reason does not stop the others from writing theirs.
      - name: Regenerate
        working-directory: chat_scroll_view
        run: |
          for member in . packages/chrome_foundation packages/composer_editable packages/chat_composer example; do
            echo "::group::$member"
            (cd "$member" && flutter test --update-goldens test/unit_test.dart) || echo "::warning::$member: tests failed"
            echo "::endgroup::"
          done

      - name: Commit the PNGs
        working-directory: chat_scroll_view
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.png'
          git status --short | head -50
          if git diff --cached --quiet; then
            echo "No golden changed."
          else
            git commit -m "test: regenerate golden baselines on the CI runner"
            git push
          fi
