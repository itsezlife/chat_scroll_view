name: lottie_native prebuilts

# UNTESTED ON GITHUB: this workflow was written without a hosted runner. Its
# YAML parses; nothing else about it has run. Expect to fix it on first use.
#
# Builds the native Lottie library for every target key of
# packages/lottie_native/native/prebuilts.json, checks each file against its
# target with `native/tool/verify_artifact.dart`, assembles the manifest with
# `native/tool/assemble_manifest.dart --require-all` and publishes the
# libraries and the manifest on the GitHub Release of the tag
# (ADR 042: CI builds, the hook downloads hash-pinned files).
#
# The workflow never commits: the manifest is also uploaded as a workflow
# artifact, and the maintainer commits it through a pull request (README,
# "Publishing prebuilts"). Run from a branch (workflow_dispatch) it builds and
# assembles but publishes nothing; the manifest then points at the release of
# the crate version's tag, which does not exist yet.
#
# Each build job spells out `cargo build --release --locked --target ...` (and
# the Android linker, which is the hook's too) instead of calling the hook's
# builder: that builder is `compileCrate` in hook/src/cargo_build.dart, reached
# through a Flutter build with a hook input, and a leg that only needs cargo
# should not need Flutter to build. The copy can drift from the hook, so every
# leg then runs `verify_artifact.dart`, which holds the result to the hook's
# own header check (machine, 16 KB pages on Android) and fails the leg on a
# bad file. The duplication is listed in the package README ("Publishing
# prebuilts").
#
# Android is built at API 21, Flutter's minimum, so one prebuilt loads on every
# supported device; the hook, which builds for the app, uses the app's API
# level.
#
# No `run:` script interpolates `${{ github.ref_name }}` or an input: a tag
# name is text anyone with push access chooses, so such values reach scripts
# through `env:` and are quoted.
#
# Actions are pinned to major tags (`actions/checkout@v4`), not to commit
# SHAs: a deliberate decision. Only first-party `actions/*` and
# `subosito/flutter-action` are used, a SHA pin would need a bot to keep it
# fresh, and the one job that holds a write permission (`release`) runs only
# `gh` and downloads. Revisit if a third-party action with a token is added.
on:
  push:
    tags: ['lottie_native-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lottie-native-prebuilts-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Relative to the repository checkout (`chat_scroll_view/`).
  PACKAGE_DIR: packages/lottie_native

jobs:
  build:
    name: build ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS runner builds Apple targets; the iOS ones need the SDK.
          - {key: macos-arm64, runner: macos-14, triple: aarch64-apple-darwin, built: libchat_lottie.dylib, ext: dylib}
          - {key: macos-x64, runner: macos-14, triple: x86_64-apple-darwin, built: libchat_lottie.dylib, ext: dylib}
          - {key: ios-arm64, runner: macos-14, triple: aarch64-apple-ios, built: libchat_lottie.dylib, ext: dylib}
          - {key: ios-arm64-simulator, runner: macos-14, triple: aarch64-apple-ios-sim, built: libchat_lottie.dylib, ext: dylib}
          - {key: ios-x64-simulator, runner: macos-14, triple: x86_64-apple-ios, built: libchat_lottie.dylib, ext: dylib}
          - {key: linux-x64, runner: ubuntu-24.04, triple: x86_64-unknown-linux-gnu, built: libchat_lottie.so, ext: so}
          - {key: linux-arm64, runner: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, built: libchat_lottie.so, ext: so}
          - {key: android-arm64, runner: ubuntu-24.04, triple: aarch64-linux-android, built: libchat_lottie.so, ext: so, ndk_prefix: aarch64-linux-android21}
          - {key: android-x64, runner: ubuntu-24.04, triple: x86_64-linux-android, built: libchat_lottie.so, ext: so, ndk_prefix: x86_64-linux-android21}
          - {key: windows-x64, runner: windows-2022, triple: x86_64-pc-windows-msvc, built: chat_lottie.dll, ext: dll}
    defaults:
      run:
        shell: bash
    env:
      KEY: ${{ matrix.key }}
      TRIPLE: ${{ matrix.triple }}
      BUILT: ${{ matrix.built }}
      EXT: ${{ matrix.ext }}
      NDK_PREFIX: ${{ matrix.ndk_prefix }}
    steps:
      # The workspace root overrides flutter_md with `path: ../md`, so the fork
      # is checked out as a sibling of the repo, as in check.yml; Flutter is
      # here only to resolve the workspace for verify_artifact.dart.
      - uses: actions/checkout@v4
        with:
          path: chat_scroll_view
      - uses: actions/checkout@v4
        with:
          repository: itsezlife/md
          ref: v0.9.0
          path: md

      # The runners ship rustup; the crate needs rust-version 1.88 or newer.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TRIPLE"
          rustc --version

      - name: Build
        working-directory: chat_scroll_view/${{ env.PACKAGE_DIR }}/native
        run: |
          if [ -n "$NDK_PREFIX" ]; then
            # Same linker and page size the hook uses for Android: the
            # runner's NDK, and 16 KB pages (Android 15 devices).
            toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            triple_env="$(echo "$TRIPLE" | tr 'a-z-' 'A-Z_')"
            triple_cc="$(echo "$TRIPLE" | tr '-' '_')"
            export "CARGO_TARGET_${triple_env}_LINKER=$toolchain/$NDK_PREFIX-clang"
            export "CC_${triple_cc}=$toolchain/$NDK_PREFIX-clang"
            export "AR_${triple_cc}=$toolchain/llvm-ar"
            export "CARGO_TARGET_${triple_env}_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384"
          fi
          cargo build --release --locked --target "$TRIPLE"

      - name: Name the library as it is published
        run: |
          mkdir -p out
          cp "chat_scroll_view/$PACKAGE_DIR/native/target/$TRIPLE/release/$BUILT" \
            "out/libchat_lottie-$KEY.$EXT"
          ls -l out

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Resolve workspace
        working-directory: chat_scroll_view
        run: flutter pub get --enforce-lockfile

      # Fails the leg, not only the release: a library built for the wrong
      # CPU, or on 4 KB pages for Android, never reaches the artifacts.
      - name: Verify the library against its target
        working-directory: chat_scroll_view/${{ env.PACKAGE_DIR }}
        run: dart native/tool/verify_artifact.dart "$GITHUB_WORKSPACE/out/libchat_lottie-$KEY.$EXT" "$KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.key }}
          path: out/libchat_lottie-${{ matrix.key }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: assemble prebuilts.json
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # The workspace root overrides flutter_md with `path: ../md`, so the fork
      # is checked out as a sibling of the repo, as in check.yml.
      - uses: actions/checkout@v4
        with:
          path: chat_scroll_view
      - uses: actions/checkout@v4
        with:
          repository: itsezlife/md
          ref: v0.9.0
          path: md
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Resolve workspace
        working-directory: chat_scroll_view
        run: flutter pub get --enforce-lockfile

      # A tag names the release; a branch run uses the tag the crate version
      # would get. A pushed tag that disagrees with Cargo.toml is a mistake.
      - name: Release tag
        id: tag
        working-directory: chat_scroll_view/${{ env.PACKAGE_DIR }}/native
        run: |
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n1)"
          expected="lottie_native-v$version"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$expected" ]; then
            echo "tag $REF_NAME does not match Cargo.toml version (expected $expected)" >&2
            exit 1
          fi
          echo "tag=$expected" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          merge-multiple: true
          path: libs

      # Every key is required: a release missing a target is refused here, not
      # discovered by a user whose build silently falls back to compiling. The
      # key list is the hook's (`--require-all`), not a copy in this file.
      - name: Assemble the manifest
        working-directory: chat_scroll_view/packages/lottie_native
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          dart native/tool/assemble_manifest.dart "$GITHUB_WORKSPACE/libs" \
            --base-url "https://github.com/$REPOSITORY/releases/download/$TAG/" \
            --require-all \
            --out "$GITHUB_WORKSPACE/manifest/prebuilts.json"
          cat "$GITHUB_WORKSPACE/manifest/prebuilts.json"

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilts-manifest
          path: manifest/prebuilts.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: assemble
    # Only a tag publishes; a branch run stops at the manifest artifact.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: prebuilts-manifest
          path: release
      # Fails when the release exists: published files are never replaced, the
      # manifest pins their hashes.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.assemble.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes "Prebuilt native libraries for lottie_native. Commit the attached prebuilts.json through a pull request; see the package README, Publishing prebuilts."
