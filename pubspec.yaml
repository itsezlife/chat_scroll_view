name: chat_scroll_view
description: Endless, anchor-based chat scroll viewport for Flutter.
version: 0.1.0+1
publish_to: none

# One resolution and one committed lockfile for the repo. Append new packages
# here; scripts/check reads the list literally (no globs) and fails when a
# package under packages/ or example/ is missing from it.
workspace:
  - packages/catalog_assets
  - packages/chat_composer
  - packages/chrome_foundation
  - packages/composer_editable
  - packages/content_model
  - packages/emoji_catalog_pack
  - packages/emoji_data
  - packages/image_decoder
  - packages/kv_shared_preferences
  - packages/panel_catalog
  - packages/panel_pages
  - packages/panel_presentation
  - packages/panel_shell
  - packages/rich_clipboard
  - example
  - scripts

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  flutter_md:
    git:
      url: https://github.com/itsezlife/md.git
      ref: v0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

# Overrides are honoured only here, never in members. Members and CI pin the
# fork by release tag (v0.3.0, itsezlife/md) so the lockfile is reproducible;
# this override points the root at the sibling checkout so fork work lands
# without a push-and-repin loop. CI checks the same tag out next to this repo,
# so the override and the pin resolve to the same source there. Move the tag in
# every pin (this file, example/pubspec.yaml, the three workflows) together.
dependency_overrides:
  flutter_md:
    path: ../md
