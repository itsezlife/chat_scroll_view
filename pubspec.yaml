name: chat_scroll_view
description: Endless, anchor-based chat scroll viewport for Flutter.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  flutter_md:
    git:
      url: https://github.com/itsezlife/md.git
      ref: feat/selection-chrome

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

dependency_overrides:
  flutter_md:
    path: ../md
