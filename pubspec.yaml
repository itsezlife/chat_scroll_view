name: chat_scroll_view
description: Endless, anchor-based chat scroll viewport for Flutter.
version: 0.4.0
publish_to: none

# One resolution and one committed lockfile for the repo. Append new packages
# here; scripts/check reads the list literally (no globs) and fails when a
# package under packages/ or example/ is missing from it.
workspace:
  - packages/attach_model
  - packages/attach_sheet
  - packages/bulletins
  - packages/chat_capabilities
  - packages/chat_composer
  - packages/chat_wallpaper
  - packages/chrome_foundation
  - packages/composer_editable
  - packages/content_assets
  - packages/content_model
  - packages/emoji_catalog_pack
  - packages/emoji_data
  - packages/glyph_atlas
  - packages/golden_baseline
  - packages/kv_shared_preferences
  - packages/message_media
  - packages/panel_catalog
  - packages/panel_pages
  - packages/panel_presentation
  - packages/panel_shell
  - packages/rich_clipboard
  - packages/swipe_pager
  - packages/viewport_scroll
  - example
  - scripts

environment:
  sdk: ^3.11.0
  # The SDK CI and .fvmrc pin; composer_editable vendors its sources and holds
  # the same exact version. Raise all of them with
  # `dart packages/composer_editable/tool/revendor.dart`.
  flutter: 3.41.7

dependencies:
  # The embed adapter (content_assets, over mpx_core's asset cache), the
  # emoji-only body's input (content_model) and the scroll physics and keys the
  # panel catalogue shares (viewport_scroll); ADR 020. None depends on this
  # package.
  content_assets:
    path: packages/content_assets
  content_model:
    path: packages/content_model
  viewport_scroll:
    path: packages/viewport_scroll
  flutter:
    sdk: flutter
  meta: ^1.17.0
  # mpx (github.com/itsezlife/mpx) is consumed from git, every package pinned
  # to one commit: a full sha, the same in every pubspec, moved together when
  # the chat takes a new mpx (until mpx publishes; ADR 0009 there).
  mpx_core:
    git:
      url: https://github.com/itsezlife/mpx.git
      path: packages/mpx_core
      ref: 645a44248c1f68224fcbb8e521d024171b124546
  flutter_md:
    git:
      url: https://github.com/itsezlife/md.git
      ref: v0.9.3

dev_dependencies:
  # Golden baselines are the CI runner's: compared and regenerated there only.
  golden_baseline:
    path: packages/golden_baseline
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  vm_service: ^15.0.0

# The native libraries of mpx (FFmpeg and the video wrapper, the Lottie
# renderer) come prebuilt from mpx's releases through its build hooks; no
# local build is needed. To try a local FFmpeg build instead, name its recipe
# build directory here (read from the workspace root only):
#   hooks:
#     user_defines:
#       mpx_video_decoder:
#         ffmpeg_build: ../mpx/packages/mpx_video_decoder/native/.build

# Overrides are honoured only here, never in members. Members and CI pin the
# fork by git ref (itsezlife/md) so the lockfile is reproducible: a release tag,
# or a commit while the change it carries has no release yet (now v0.9.3).
# This override points the root at the sibling checkout so fork work lands
# without a push-and-repin loop. CI checks the same ref out next to this repo,
# so the override and the pin resolve to the same source there. Move the ref in
# every pin (this file, example/pubspec.yaml, the five workflows) together.
dependency_overrides:
  flutter_md:
    path: ../md
